apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
  - port: 8001
    targetPort: 8001
    name: http
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: web
  ports:
  - port: 8080
    targetPort: 8080
    name: http
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
spec:
  selector:
    app: mongo
  ports:
  - port: 27017
    targetPort: 27017
    name: mongo
  clusterIP: None
---
apiVersion: v1
kind: Service
metadata:
  name: api-metrics
spec:
  selector:
    app: api
  ports:
  - port: 8001
    targetPort: 8001
    name: http
  clusterIP: None
