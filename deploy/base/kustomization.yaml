apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: teamtasks
resources:
- namespace.yaml
- workloads.yaml
- services.yaml
- network-policy.yaml
configMapGenerator:
- name: mongo-init
  files:
  - mongo-init.js
- name: app-config
  literals:
  - CORS_ORIGINS=http://localhost:8080
  - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
  - OTEL_TRACES_SAMPLER=parentbased_traceidratio
  - OTEL_TRACES_SAMPLER_ARG=1.0
