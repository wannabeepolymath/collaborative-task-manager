name: Verify and deploy to disposable Kubernetes
on:
  pull_request:
  push:
    branches: [main, codex/devops-project]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and test backend
        run: |
          python -m pip install -r backend/requirements-dev.txt
          python -m pytest backend/tests -q
      - name: Audit runtime Python dependencies
        run: pip-audit -r backend/requirements.txt
      - name: Check for tracked environment files
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.example$'; then
            echo 'Unexpected environment file tracked'; exit 1
          fi
      - name: Build exact revision
        run: |
          VERSION=$(git rev-parse HEAD)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          docker build --target api --build-arg APP_VERSION="$VERSION" -t teamtasks-api:$VERSION .
          docker build --target web -t teamtasks-web:$VERSION .
      - name: Start Kubernetes
        run: |
          if ! command -v kind >/dev/null; then
            curl -fsSL https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64 -o /tmp/kind
            chmod +x /tmp/kind
            sudo mv /tmp/kind /usr/local/bin/kind
          fi
          kind create cluster --name teamtasks --wait 120s
      - name: Load and deploy images
        env:
          KUBE_CONTEXT: kind-teamtasks
        run: |
          kind load docker-image --name teamtasks teamtasks-api:$VERSION teamtasks-web:$VERSION
          bash scripts/deploy.sh
      - name: Verify running user journey
        run: |
          kubectl --context kind-teamtasks -n teamtasks port-forward svc/web 8080:8080 > /tmp/forward.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/api/ready && break; sleep 2; done
          EXPECTED_VERSION=$VERSION python scripts/smoke.py | tee smoke.json
          curl -fsS http://localhost:8080/ -o /tmp/teamtasks-index.html
          grep -q '<!DOCTYPE html>' /tmp/teamtasks-index.html
      - name: Record runtime evidence
        if: always()
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          kubectl --context kind-teamtasks -n teamtasks get pods,deployments,statefulsets,services,pvc -o wide > evidence/runtime.txt || true
          kubectl --context kind-teamtasks -n teamtasks logs -l app=api --tail=100 > evidence/api-logs.txt || true
          cp smoke.json evidence/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-evidence
          path: evidence/
