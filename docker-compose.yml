services:
  api:
    build:
      context: .
      target: api
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    env_file: .local/runtime.env
    environment:
      CORS_ORIGINS: http://localhost:8080
    depends_on:
      mongo:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/ready')"]
      interval: 10s
      timeout: 3s
      retries: 12
  web:
    build:
      context: .
      target: web
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [api]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  mongo:
    image: mongo:7.0
    env_file: .local/runtime.env
    volumes:
      - mongo-data:/data/db
      - ./deploy/mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  mongo-data:
